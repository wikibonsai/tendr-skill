# Tendr garden hooks for gptme.
# Add to ~/.config/gptme/config.toml or gptme.toml [hooks] section.

[hooks]

[hooks.SESSION_START]
command = "bash scripts/load.sh"
timeout = 10

[hooks.TOOL_PRE_EXECUTE]
# recall relevant garden nodes before each tool call
command = "bash scripts/recall.sh"
timeout = 15
